# CX CRM ERP on one server: database, API, web app and the HTTPS front door.
# Start with:  bash deploy/install.sh your-domain.com
name: cx-crm-erp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/install.sh first to create the .env file}
      POSTGRES_DB: cx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cx -d cx"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cx:${POSTGRES_PASSWORD}@db:5432/cx
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
